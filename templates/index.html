<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Petri Net Visual Platform (Graphviz SVG)</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <div style="display: flex; gap: 40px; align-items: flex-start; margin-bottom: 32px;">
      <div>
        <h3>Petri Net Visualization</h3>
        <div id="petri-net-canvas" style="width: 800px; min-height: 500px; border:1px solid #bbb; background: #fcfcfc;"></div>
      </div>
    </div>
    <div style="display: flex; gap: 32px;">
        <!-- Left Column -->
        <div style="flex: 1;">
            <section class="section" id="upload-view">
                <h2>Upload Petri Net</h2>
                <input type="file" id="pnmlInput" accept=".pnml"/>
            </section>
            <section class="section" id="pattern-info" style="margin-top: 32px;">
                <h2>Pattern Information</h2>
                <div id="patternDetails"></div>
            </section>
        </div>
        <!-- Right Column -->
        <div style="flex: 1;">
            <section class="section" id="llm-response">
                <h2>LLM-Generated Response</h2>
                <div id="llmOutput" class="output-box"></div>
            </section>
            <section class="section" id="user-additional" style="margin-top: 32px;">
                <h2>Additional Context for Prompt</h2>
                <textarea id="userContext" placeholder="Enter any useful info or preferences..."></textarea>
            </section>
            <section class="section horizontal" style="margin-top: 32px;">
                <div class="strategy-selector">
                    <label for="strategy">Prompting Strategy:</label>
                    <select id="strategy">
                        <option value="zero-shot">Zero-shot</option>
                        <option value="one-shot">One-shot</option>
                        <option value="pattern-augmented">Pattern-Augmented</option>
                    </select>
                </div>
                <button id="startBtn">Start</button>
            </section>
        </div>
    </div>
</div>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
