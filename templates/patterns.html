<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pattern Library</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body { font-family: "Segoe UI", Arial, sans-serif; background: #f7f8fa; margin: 0; }
    .container { display: flex; height: 100vh; }
    .sidebar { width: 260px; background: #fff; border-right: 1px solid #bbb; padding: 18px 0 0 18px; box-sizing: border-box; display: flex; flex-direction: column; }
    .sidebar h2 { margin-bottom: 12px; }
    .pattern-list { flex: 1; overflow-y: auto; }
    .pattern-list-item { cursor: pointer; padding: 8px 10px; border-radius: 5px; margin-bottom: 3px; }
    .pattern-list-item.selected { background: #e5eaff; font-weight: bold; }
    .sidebar button { margin: 14px 6px 10px 0; padding: 6px 16px; font-size: 1em; border-radius: 5px; background: #2e7df6; color: #fff; border: none; cursor: pointer; }
    .main { flex: 1; display: flex; flex-direction: column; padding: 34px 38px; }
    .pattern-actions { margin-top: 18px; }
    .pattern-actions button { margin-right: 8px; padding: 6px 20px; border-radius: 5px; border: 1px solid #888; background: #f3f6ff; cursor: pointer; }
    .pattern-actions button:hover { background: #e5eaff; }
    .pattern-figure { background: #fff; border: 1.5px solid #bbb; border-radius: 7px; padding: 22px; min-height: 180px; margin-bottom: 24px; display: flex; align-items: center; justify-content: center; }
    .pattern-desc textarea { width: 100%; min-height: 100px; font-size: 1.08em; border-radius: 5px; border: 1px solid #ccc; padding: 8px; resize: vertical; }
    .field-label { font-weight: bold; margin-top: 8px; }
    .input-row { margin-bottom: 12px; }
    .input-row input[type="text"] { width: 70%; padding: 7px; font-size: 1em; }
    .toast { position: fixed; bottom: 28px; right: 28px; background: #232; color: #fff; padding: 10px 18px; border-radius: 6px; z-index: 99; opacity: 0.97; font-size: 1.01em; box-shadow: 0 2px 12px #0002;}
  </style>
</head>
<body>
<div class="container">
  <aside class="sidebar">
    <h2>Patterns</h2>
    <button onclick="showNewPatternPanel()">New Pattern</button>
  <button onclick="window.location.href='/'" style="margin-top: 6px;">⬅ Back to Main</button>

    <div id="patternList" class="pattern-list"></div>
  </aside>
  <main class="main" id="mainPanel">
  <div id="welcomePanel">
    <div style="color:#777; text-align:center; margin-top: 100px;">
      Select a pattern or create a new one.
    </div>
  </div>
  <div id="newPatternPanel" style="display:none">
    <div class="pattern-figure" id="newPatternFigure" style="color:#777;">Upload PNML to preview it here.</div>
    <div class="field-label">Pattern Name:</div>
    <div class="input-row"><input type="text" id="patternNameInput" placeholder="New pattern name"></div>
    <div class="field-label">Description:</div>
    <div class="pattern-desc"><textarea id="patternDescInput" placeholder="Description"></textarea></div>
    <div class="field-label">PNML File:</div>
    <input type="file" id="pnmlInput" accept=".pnml" style="margin-bottom:12px;">
    <div class="pattern-actions">
      <button id="saveNewBtn">Save</button>
      <button id="cancelNewBtn">Cancel</button>
    </div>
  </div>
  <div id="patternDetailPanel" style="display:none"></div>
</main>

</div>
<div id="toast" class="toast" style="display:none"></div>
<script src="{{ url_for('static', filename='patterns.js') }}"></script>
</body>
</html>
